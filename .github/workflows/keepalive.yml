name: keepalive
# Supabase pauses free-tier projects after 7 days without database activity,
# and the live site then fails every request with a generic network error.
# Ping the database once a day so the project never goes idle.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: netlify.toml, sparse-checkout-cone-mode: false }
      - name: Query the database
        run: |
          url=$(sed -nE 's/^ *VITE_SUPABASE_URL *= *"([^"]+)".*/\1/p' netlify.toml)
          key=$(sed -nE 's/^ *VITE_SUPABASE_PUBLISHABLE_KEY *= *"([^"]+)".*/\1/p' netlify.toml)
          # A made-up screen token makes Postgres run the function and raise its
          # own error. Any PostgREST error carries a "code" field; gateway errors
          # from a paused or unreachable project do not.
          for attempt in 1 2 3; do
            body=$(curl -sS -m 30 "$url/rest/v1/rpc/board_snapshot?p_screen_token=keepalive" \
              -H "apikey: $key" -H "authorization: Bearer $key" || true)
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"code"'; then exit 0; fi
            sleep 60
          done
          echo "::error::Supabase did not answer from the database. Restore the project in the dashboard."
          exit 1
      # GitHub disables scheduled workflows in repositories with no activity for
      # 60 days. Re-enabling the workflow through the API resets that timer.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
