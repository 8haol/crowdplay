[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Supabase publishable credentials are intentionally shipped to browsers.
  # Keeping them here makes Git-triggered builds deterministic; database
  # authorization is enforced by RLS and the RPC grants, never by this key.
  VITE_SUPABASE_URL = "https://gohrobxiznbrrncrcmjo.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Zac7Wd4Nyb1_-y1xl5Kb1Q_G8FBaiPA"
  # These are intentionally public browser credentials. Vite embeds them in
  # the client bundle; Supabase authorization still lives in RLS/RPC grants.
  # Without this narrow exemption Netlify's secret scanner rejects the build
  # precisely because it finds the expected values in dist/assets/*.js.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_PUBLISHABLE_KEY"

# SPA fallback for /play /staff /admin
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.r2.cloudflarestorage.com; media-src 'self' blob: https://*.r2.cloudflarestorage.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.r2.cloudflarestorage.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tour/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
